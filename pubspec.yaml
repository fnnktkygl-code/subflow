name: aada_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <3.0.0"  # Ensure this is compatible with Flutter 3.5.3

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2 # Add the latest version here
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.1
  flutter_staggered_animations: ^1.1.1
  flutter_local_notifications: ^19.4.2
  table_calendar: ^3.0.3
  collection: ^1.15.0
  fl_chart: ^0.69.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0  # Moved to regular dependencies
  provider: ^6.1.2 # Add this line
  google_sign_in: ^6.2.1
  flutter_signin_button: ^2.0.0
  shared_preferences: ^2.0.11
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  flag: ^7.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider:
  flutter_colorpicker: ^1.1.0
  flutter_animate: ^4.5.2        # For easy animations
  percent_indicator: ^4.2.2     # For the circular progress bar
  timezone: ^0.10.1 # Add this line
  webview_flutter: ^4.7.0
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^9.0.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo_hat.svg"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/barbie.png

  fonts:
    - family: SF_Pro
      fonts:
        - asset: assets/fonts/SF_Pro/SF-Pro.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf

# Localization setup
l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  output-class: AppLocalizations
